# Log-Rotation für alle Services (json-file wächst sonst unbegrenzt).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Reverse-Proxy mit automatischem HTTPS (Let's Encrypt).
  # Läuft nur in Produktion: aktiviert über COMPOSE_PROFILES=production
  # (siehe .env). Terminiert TLS für ${APP_DOMAIN} und reicht den Traffic
  # intern an die Node-App auf Port 3000 weiter. Die Zertifikate liegen im
  # Volume caddy_data, damit Let's Encrypt sie nicht bei jedem Neustart neu
  # ausstellt (Rate-Limits!).
  caddy:
    image: caddy:2-alpine
    profiles: [production]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - app
    networks: [default, proxy]
    restart: unless-stopped
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    # Dev: "watch" (Hot-Reload). Produktion: TSX_WATCH= (leer) in der .env setzen,
    # sonst restartet jeder Deploy-rsync die App mehrfach mit Mischständen.
    command: sh -c "exec tsx $${TSX_WATCH-watch} src/server.ts"
    ports:
      # Produktion: APP_BIND=127.0.0.1:3000 setzen, damit Port 3000 nicht am
      # Caddy vorbei öffentlich erreichbar ist.
      - "${APP_BIND:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./resources:/app/resources
      - ./migrations:/app/migrations
      - ./data/pdfs:/app/data/pdfs
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # Bewusst kein env_file: Die App bekäme sonst die ganze .env inklusive
    # DB_ROOT_PASSWORD und ACME_EMAIL – die braucht nur db bzw. caddy. Neue
    # Variablen, die src/ per process.env liest, hier ergänzen.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_URL: ${APP_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS:-}
      REPLY_TRUSTED_DOMAINS: ${REPLY_TRUSTED_DOMAINS:-}
      PHOTON_URL: ${PHOTON_URL:-}
      TILESERVER_URL: ${TILESERVER_URL:-}
      ALPR_URL: ${ALPR_URL:-}
      ALPR_ENABLED: ${ALPR_ENABLED:-}
      ALPR_MIN_CONFIDENCE: ${ALPR_MIN_CONFIDENCE:-}
      PORTAL_URL: ${PORTAL_URL:-}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-}
      # Shell-Default im command oben: unset ⇒ "watch" (Dev), leer ⇒ kein watch (Prod).
      TSX_WATCH: ${TSX_WATCH-watch}
    # Speichergrenze: Ein Riesenbild oder ein Leck darf nicht den ganzen Host
    # (8 GB, geteilt mit DB, Tileserver, Photon, ALPR) in den OOM-Killer treiben.
    mem_limit: 2g
    networks: [default, proxy]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: mariadb:11
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging: *default-logging

  mail:
    image: axllent/mailpit
    ports:
      # Produktion: MAILPIT_BIND=127.0.0.1:8025 (UI nicht öffentlich; wird bei
      # MAIL_DRIVER=smtp ohnehin nicht genutzt).
      - "${MAILPIT_BIND:-8025}:8025"
    networks: [default, proxy]
    restart: unless-stopped
    logging: *default-logging

  # OpenStreetMap-Geocoder für die Adresssuche (Autovervollständigung).
  # Lädt beim ersten Start automatisch den fertigen Deutschland-Index
  # (mehrere GB) herunter und entpackt ihn nach ./data/photon. Das dauert
  # einige Minuten; solange liefert /api/geo/search einfach keine Treffer.
  # REGION akzeptiert "germany"/"de" oder z.B. "planet" bzw. mehrere Länder.
  photon:
    image: rtuszik/photon-docker:latest
    environment:
      - REGION=germany
      - UPDATE_STRATEGY=PARALLEL
    volumes:
      - ./data/photon:/photon/data
    mem_limit: 1500m
    # Port nur bei Bedarf zum Debuggen freigeben – die App spricht Photon
    # intern über den Namen "photon:2322" an.
    # ports:
    #   - "2322:2322"
    restart: unless-stopped
    logging: *default-logging

  # OSM-Raster-Tileserver. Prod-Daten seit 10/2026: Hessen + Mainzer Stadtgebiet + Hamburg
  # (Mainz liegt in RLP), importiert mit scripts/tiles-import.sh. Der
  # Auto-Import unten lädt nur Hessen – bei einem leeren Volume danach das
  # Skript laufen lassen, sonst fehlen Mainz und Hamburg.
  # Rendert Karten-Kacheln, die die App same-origin über /tiles/{z}/{x}/{y}.png
  # ausliefert (Proxy in src/routes/tiles.ts) – daher kein Port nach außen.
  #
  # Auto-Import beim ersten Start: Fehlt der Import-Marker im Volume, läuft
  # einmalig der Hessen-Import (baut die PostGIS-Render-DB, ~10–30 Min), danach
  # der Tileserver. Dadurch funktioniert auch ein frisches `docker compose up -d`
  # (inkl. automatischem Deploy) ohne manuellen Zwischenschritt; Folge-Deploys
  # überspringen den Import (Marker liegt im persistenten Volume osm-tile-data).
  # Während des Imports liefert /tiles leere Kacheln – die App blockiert nicht.
  tileserver:
    image: overv/openstreetmap-tile-server:latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -f /data/database/planet-import-complete ]; then
          # Kein Abschluss-Marker => evtl. abgebrochener Import. Ein halb
          # angelegtes Cluster (Rolle "renderer"/DB "gis" existieren bereits)
          # ließe den Re-Import an `createuser renderer` scheitern
          # ("role already exists" -> Crash-Schleife). Daher das unvollständige
          # Postgres-Verzeichnis verwerfen und sauber von vorn importieren.
          echo "Kein Import-Marker – räume evtl. unvollständigen Import-Stand und importiere neu ..."
          rm -rf /data/database/postgres
          /run.sh import
        fi
        exec /run.sh run
    environment:
      - DOWNLOAD_PBF=https://download.geofabrik.de/europe/germany/hessen-latest.osm.pbf
      - DOWNLOAD_POLY=https://download.geofabrik.de/europe/germany/hessen.poly
    volumes:
      - osm-tile-data:/data/database/
      - osm-tile-cache:/data/tiles/
    mem_limit: 2g
    shm_size: 512m
    restart: unless-stopped
    logging: *default-logging

  # Kennzeichenerkennung (YOLOv11 + PaddleOCR) für hochgeladene Beweisfotos.
  # Läuft in Produktion automatisch mit; in der Entwicklung opt-in über
  # COMPOSE_PROFILES=alpr (plus ALPR_ENABLED=on in der .env). Die App spricht
  # den Dienst intern über "alpr:8000" an und degradiert ohne ihn graceful
  # (Kennzeichen-Feld bleibt dann einfach leer). Kein Port nach außen; die
  # Fotos verlassen den Host nie. CPU-only, Modelle sind ins Image gebacken.
  alpr:
    build: ./docker/alpr
    profiles: [production, alpr]
    mem_limit: 2g
    # Foto-Verarbeitung darf nur 2 der 4 Kerne nutzen: fest auf CPU 2–3 gepinnt
    # (cpuset) und zusätzlich auf 2 Kerne gedeckelt. App, DB, Caddy und
    # Tileserver behalten so immer die Kerne 0–1.
    cpuset: "2-3"
    cpus: 2
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Browser-Automatisierung für Online-Anzeigeformulare (Frankfurt nimmt seit
  # 10/2026 nur noch das ekom21/civento-Portal statt PDF-Mails). Füllt das
  # Formular per Playwright aus, die App zeigt den Lauf live und schickt erst
  # nach Bestätigung ab (services/portalDispatch.ts). Intern "portal:8080",
  # kein Port nach außen. Chromium startet erst beim ersten Lauf.
  portal:
    build: ./docker/portal
    init: true
    mem_limit: 1500m
    shm_size: 256m
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  osm-tile-data:
  osm-tile-cache:

# Gemeinsames Netz von Prod- und Dev-Stack: Der Prod-Caddy erreicht darüber
# die Dev-Container (dev.<domain> / dev-mail.<domain>, siehe Caddyfile).
# Muss vor dem ersten Start existieren: docker network create owia-proxy
# (macht deploy.sh automatisch). Achtung: Der Service-Alias "app" ist in
# diesem Netz mehrdeutig (Prod- UND Dev-App tragen ihn) – das Caddyfile
# nutzt deshalb die eindeutigen Containernamen (owia-app-1 usw.). Die kommen
# aus dem Compose-Projektnamen: Prod = Verzeichnisname "owia", Dev = per
# COMPOSE_PROJECT_NAME=ffm-owianzeiger in der Dev-.env gepinnt.
networks:
  proxy:
    name: owia-proxy
    external: true

name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Actions per Commit-SHA gepinnt (Tag als Kommentar); Dependabot hält sie aktuell.
jobs:
  # Schnell und ohne Docker: Typecheck, Syntax (Browser-JS, Portal, EJS),
  # Biome-Lint, Unit-Tests (tests/unit).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Regressionstests mit Wegwerf-MariaDB und Mailpit (compose.test.yml).
  integration:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # ALPR-Dienst (Python): Lint nach docker/alpr/ruff.toml und Byte-Compile.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: docker/alpr
          version: '0.17.1'
      - run: python3 -m py_compile docker/alpr/*.py

  # App-Image muss bauen (nur Abhängigkeiten – der Code kommt per Bind-Mount).
  # Portal und ALPR baut docker.yml, nur wenn sich dort etwas ändert.
  app-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/node/Dockerfile .
